<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Media</title>

  <style>
    body {
      margin: 0;
      background-color: black;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    video, img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
    }

    img {
      display: none;
    }
  </style>
</head>

<body>

  <video id="video-player" muted playsinline></video>
  <img id="image-player" alt="Display Image">

  <script>
    const videoPlayer = document.getElementById('video-player');
    const imagePlayer = document.getElementById('image-player');

    // List of media items
    const media = [
      { type: "image", src: "uselift_dual.png" },
      { type: "video", src: "TfL_Go_QuieterTimes.mp4" },
      { type: "video", src: "TfL_Dual.mp4" },
      { type: "video", src: "NR_NowTalking_Static.mp4" },
    ];

    // Pick ONE random item when the page loads
    const randomIndex = Math.floor(Math.random() * media.length);
    const selectedMedia = media[randomIndex];

    if (selectedMedia.type === "image") {

      // Show the image
      videoPlayer.style.display = "none";
      imagePlayer.style.display = "block";

      imagePlayer.src = selectedMedia.src;

    } else {

      // Show the video
      imagePlayer.style.display = "none";
      videoPlayer.style.display = "block";

      videoPlayer.src = selectedMedia.src;

      // Play the video once
      videoPlayer.play();

      // When it finishes, freeze on the final frame
      videoPlayer.addEventListener("ended", () => {
        videoPlayer.pause();
      });
    }
  </script>

</body>
</html>
